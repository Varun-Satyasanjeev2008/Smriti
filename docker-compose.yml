# ============================================================================
# Patent Prior-Art Research Agent — Docker Compose
#
# Services:
#   db          — App-level PostgreSQL + pgvector (SEPARATE from Hindsight)
#   hindsight   — Vectorize Hindsight memory server (bundled Postgres inside)
#   agent       — FastAPI application
#
# Start everything:
#   docker compose up --build
#
# The FastAPI agent will be available at http://localhost:8000
# Hindsight control plane UI at http://localhost:9999
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # App-level Postgres with pgvector
  # Used for: patent_cache, request_log tables
  # NOT shared with Hindsight.
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: patent_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patentuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patentpass}
      POSTGRES_DB: ${POSTGRES_DB:-patentdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patentuser} -d ${POSTGRES_DB:-patentdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # Hindsight — Agent Memory System
  # Bundles its own embedded PostgreSQL internally; do NOT connect to it.
  # Port 8888: REST API (used by the agent)
  # Port 9999: Web control-plane UI (optional, for debugging)
  # --------------------------------------------------------------------------
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: patent_agent_hindsight
    restart: unless-stopped
    pull_policy: always
    environment:
      # LLM provider for Hindsight's internal memory reasoning
      # Groq is natively supported. Change HINDSIGHT_API_LLM_PROVIDER if desired.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-groq}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-openai/gpt-oss-120b}
      HINDSIGHT_API_LLM_GROQ_SERVICE_TIER: on_demand
      # Stable worker identity so memory persists across container restarts
      HINDSIGHT_API_WORKER_ID: hindsight-patent-agent
    volumes:
      # Persist Hindsight's embedded Postgres data
      - hindsight_data:/home/hindsight/.pg0
    ports:
      - "8888:8888"   # REST API & MCP endpoint
      - "9999:9999"   # Control plane UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # --------------------------------------------------------------------------
  # FastAPI Agent
  # --------------------------------------------------------------------------
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patent_agent_api
    restart: unless-stopped
    environment:
      # Groq (agent's own LLM reasoning)
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}

      # App-level Postgres connection (asyncpg driver)
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patentuser}:${POSTGRES_PASSWORD:-patentpass}@db:5432/${POSTGRES_DB:-patentdb}

      # Hindsight memory API
      HINDSIGHT_URL: ${HINDSIGHT_URL:-http://hindsight:8888}

      # Optional, verified local development corpus maintained by Patent Data_Search
      PATENT_DATA_SEARCH_PATH: /opt/patent_data_search

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      # Local patent corpus (Patent-Data_Search project).
      # The corpus lives at ./Patent-Data_Search/patent_search.py relative
      # to this docker-compose.yml file.
      - "./Patent-Data_Search:/opt/patent_data_search:ro"
    depends_on:
      - db
      - hindsight
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
    driver: local
  hindsight_data:
    driver: local
